# /nodara-multi-agente/docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    container_name: nodara_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init:/docker-entrypoint-initdb.d/
    networks:
      - nodara_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: nodara_pgadmin
    restart: always
    environment:
      # Credenciales de acceso a la interfaz web de pgAdmin
      PGADMIN_DEFAULT_EMAIL: email@victorfigueroa.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - nodara_net

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nodara_backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app
      - /home/vitoto/email@victorfigueroa.cl:/home/vitoto/email@victorfigueroa.cl
    networks:
      - nodara_net

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nodara_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - nodara_net
    command: >
      sh -c "if [ ! -f package.json ]; then
        echo '🚀 Inicializando Next.js por primera vez...';
        npx create-next-app@latest tmp_app --typescript --tailwind --eslint --app --src-dir --import-alias '@/*' --yes;
        cp -a tmp_app/. ./;
        rm -rf tmp_app;
      fi;
      echo '📦 Instalando dependencias...';
      npm install;
      echo '💻 Iniciando servidor de desarrollo...';
      npm run dev"

networks:
  nodara_net:
    driver: bridge

volumes:
  postgres_data:
    name: nodara_pg_data